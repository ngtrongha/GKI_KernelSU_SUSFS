name: 'Apply Kernel Branding & Timestamp'
description: 'Apply kernel branding to kernel version string'
inputs:
  variant:
    description: 'Variant of kernel to apply branding to'
    required: true
  kernel_version:
    description: 'Kernel version (e.g., 6.1)'
    required: true
  android_version:
    description: 'Android version (e.g., android14)'
    required: true
  version:
    description: 'Combined version (e.g., android14-6.1)'
    required: true
  sublevel:
    description: 'Sublevel of kernel version (e.g., 1)'
    required: true
  brand_name:
    description: 'Branding text appended to the version (e.g., HyperHouji)'
    required: false
    default: HyperHouji

runs:
  using: "composite"
  steps:
    - name: Apply Kernel Name Branding
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        VERSION="${{ inputs.version }}"
        ANDROID_PART=$(echo "$VERSION" | cut -d- -f1)
        KERNEL_PART=$(echo "$VERSION" | cut -d- -f2)
        BRAND="${{ inputs.brand_name }}"

        if [[ ${{ inputs.version }} == "android15-6.6" || ${{ inputs.version }} == "android16-6.12" ]]; then
          KERNEL_STRING="$KERNEL_PART.${{ inputs.sublevel }}-$ANDROID_PART"
          sed -i '$d' scripts/setlocalversion && echo "echo \"$KERNEL_STRING-$BRAND\"" >> scripts/setlocalversion
        else
          sed -i '$d' scripts/setlocalversion && echo "echo \"-$ANDROID_PART-$BRAND\"" >> scripts/setlocalversion
        fi
        chmod +x scripts/setlocalversion

    - name: Customize AnyKernel3 Flash Interface for HyperHouji
      shell: bash
      run: |
        AK3_DIR="${{ github.workspace }}/AnyKernel3"
        if [ -d "$AK3_DIR" ]; then
          echo "[*] Customizing AnyKernel3 flash interface for HyperHouji..."
          cat <<'EOF' > "$AK3_DIR/banner"
 _   _                       _   _             _ _ 
| | | |_   _ _ __   ___ _ __| | | | ___  _   _(_|_)
| |_| | | | | '_ \ / _ \ '__| |_| |/ _ \| | | | | |
|  _  | |_| | |_) |  __/ |  |  _  | (_) | |_| | | |
|_| |_|\__, | .__/ \___|_|  |_| |_|\___/ \__,_|_|/ 
       |___/|_|                                |__/ 
               K   E   R   N   E   L
EOF
          AK3_SH="$AK3_DIR/anykernel.sh"
          if [ -f "$AK3_SH" ]; then
            sed -i 's/^kernel\.string=.*/kernel.string=HyperHouji Kernel for Xiaomi 14 (houji) by Ha Nguyen/' "$AK3_SH"
            sed -i 's/^device\.name1=.*/device.name1=houji/' "$AK3_SH"
            sed -i 's/^device\.name2=.*/device.name2=Xiaomi 14/' "$AK3_SH"
            sed -i 's/^device\.name3=.*/device.name3=23127PN0CC/' "$AK3_SH"
          fi
        fi
