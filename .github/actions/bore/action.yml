name: 'Setup BORE Scheduler'
description: 'Download and apply BORE Scheduler patch for Linux 6.1 kernel'
inputs:
  kernel_version:
    description: 'Kernel version (e.g. 6.1)'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Apply BORE Scheduler Patch
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        set -euo pipefail
        KVER="${{ inputs.kernel_version }}"
        if [ "$KVER" != "6.1" ]; then
          echo "[*] BORE Scheduler currently configured for kernel 6.1; skipping for $KVER."
          exit 0
        fi

        echo "[*] Downloading BORE scheduler patch for Linux 6.1..."
        BORE_URL="https://raw.githubusercontent.com/CachyOS/kernel-patches/master/6.1/sched/0001-bore-cachy.patch"
        if curl -fsSL --retry 5 --retry-delay 5 --connect-timeout 30 "$BORE_URL" -o bore-6.1.patch; then
          echo "[+] Downloaded BORE patch. Applying to kernel/common..."
          if patch -p1 -F3 --forward < bore-6.1.patch; then
            echo "[+] Successfully applied BORE scheduler patch."
          else
            echo "[!] Warning: Patch failed with forward flag, trying with fuzz..."
            patch -p1 --fuzz=3 < bore-6.1.patch || { echo "[-] Failed to apply BORE patch." >&2; exit 1; }
          fi
        else
          echo "[-] Failed to download BORE patch from $BORE_URL" >&2
          exit 1
        fi

    - name: Enable BORE Kernel Configs
      if: inputs.kernel_version == '6.1'
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_SCHED_BORE=y
