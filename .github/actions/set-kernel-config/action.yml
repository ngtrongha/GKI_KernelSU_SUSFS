name: Set Kernel Config
description: Patch gki_defconfig directly (add or modify entries)

inputs:
  config_list:
    required: true
    description: "Kernel config lines"

runs:
  using: composite
  steps:
  - name: Patch gki_defconfig
    shell: bash
    working-directory: ${{ github.workspace }}/kernel/common
    run: |
      set -euo pipefail

      DEFCONFIG="arch/arm64/configs/gki_defconfig"
      CONFIG_LIST="${{ inputs.config_list }}"

      if [ ! -f "$DEFCONFIG" ]; then
        echo "ERROR: gki_defconfig not found"
        exit 1
      fi

      apply_line() {
        local line="$1"
        line="$(echo "$line" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"

        local key value
        if [[ "$line" =~ ^#[[:space:]]*(CONFIG_[A-Za-z0-9_]+)[[:space:]]+is[[:space:]]+not[[:space:]]+set ]]; then
          key="${BASH_REMATCH[1]}"
          value="n"
        elif [[ -z "$line" || "$line" == \#* ]]; then
          return
        elif [[ "$line" == *"="* ]]; then
          key="${line%%=*}"
          value="${line#*=}"
        else
          key="$line"
          value="y"
        fi

        if [ "$value" = "n" ]; then
          echo "Processing: # $key is not set"
          if grep -q "^$key=" "$DEFCONFIG"; then
            sed -i "s|^$key=.*|# $key is not set|g" "$DEFCONFIG"
          elif grep -q "^# $key is not set" "$DEFCONFIG"; then
            :
          else
            echo "# $key is not set" >> "$DEFCONFIG"
          fi
        else
          echo "Processing: $key=$value"
          if grep -q "^$key=" "$DEFCONFIG"; then
            sed -i "s|^$key=.*|$key=$value|g" "$DEFCONFIG"
          elif grep -q "^# $key is not set" "$DEFCONFIG"; then
            sed -i "s|^# $key is not set|$key=$value|g" "$DEFCONFIG"
          else
            echo "$key=$value" >> "$DEFCONFIG"
          fi
        fi
      }

      while IFS= read -r line || [ -n "$line" ]; do
        apply_line "$line"
      done <<< "$CONFIG_LIST"